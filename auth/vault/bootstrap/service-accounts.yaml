apiVersion: v1
kind: Namespace
metadata:
  name: worker-bootstrap
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-key-relay
  namespace: worker-bootstrap
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-token-reviewer
  namespace: worker-bootstrap
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-worker-bootstrap-token-reviewer
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-worker-bootstrap-token-reviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-worker-bootstrap-token-reviewer
subjects:
  - kind: ServiceAccount
    name: vault-token-reviewer
    namespace: worker-bootstrap
