name: homelab-vault
services:
  vault:
    image: hashicorp/vault:2.2.1
    # Bypass image startup mutations; never use its default dev-mode command.
    entrypoint: ["/bin/vault"]
    command: ["server", "-config=/vault/config/vault.hcl"]
    user: vault
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "${VAULT_BIND_IP:?Set minipc Tailscale IPv4 in .env}:8200:8200"
    networks:
      default:
        gw_priority: 1
      oidc-backchannel: {}
    environment:
      # The shared DNS name resolves to Dex inside this container.
      # Use loopback for the local Vault CLI, retaining hostname verification.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_TLS_SERVER_NAME: "${VAULT_DNS_NAME:?Set minipc Tailscale DNS name}"
    volumes:
      - ./vault.local.hcl:/vault/config/vault.hcl:ro
      - ./tls.local:/vault/tls:ro
      - /var/lib/homelab-vault/raft:/vault/data
      - /var/lib/homelab-vault/audit:/vault/logs
      - /var/lib/homelab-vault/scratch:/vault/file
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default: {}
  oidc-backchannel:
    external: true
    name: homelab-oidc-backchannel
